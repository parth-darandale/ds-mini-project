  function handleOverlay(retries = 0) {
    var nextRetryCount = retries + 1;
    var rawOverlayUrl =
      window.location.search.substring(1).split("&").filter(function(query) {
        return query.indexOf("overlay_url=") == 0
      })[0]
    var overlayUrl = rawOverlayUrl ? decodeURIComponent(rawOverlayUrl.replace("overlay_url=", "")) : null;
    var overlayContentLink = document.querySelector(`a[data-lookbook-overlay-href^="${overlayUrl}"]`);
    if (overlayUrl && overlayContentLink) {
      overlayContentLink.click()
    } else if (overlayUrl && retries <= 10) {
      setTimeout(function() { handleOverlay(nextRetryCount) }, 500);
    }
  };

  handleOverlay();
</script>

<script>
var cookieCategory = "C0002";

function getCookie(cname) {
  let name = cname + "=";
  let decodedCookie = decodeURIComponent(document.cookie);
  let ca = decodedCookie.split(';');
  for(let i = 0; i <ca.length; i++) {
    let c = ca[i];
    while (c.charAt(0) == ' ') {
      c = c.substring(1);
    }
    if (c.indexOf(name) == 0) {
      return c.substring(name.length, c.length);
    }
  }
  return "";
}     // Add custom code here.


pfOnJukeboxLoad.then(function() {

      var cookiePreferences = getCookie("OptanonConsent");
      console.log('OptanonConsent cookie value is' + cookiePreferences);
      var checkExist = setInterval(function() {
        if (cookiePreferences) {
          if (cookiePreferences.includes("C0002:1")) {
            console.log('inside function to opt-in')
          pfCookieResponse(true);
          }
          else if(!cookiePreferences.includes("C0002:1")){
            console.log('inside function to opt-out')
          pfCookieResponse(false);
          }

          OneTrust.OnConsentChanged( function() {
              console.log("consent changed");
              if (pfConsentStatus() != true && getCookie("OptanonConsent").includes(cookieCategory+":1")==true) {
                  console.log('Consent Changed to Accepted');
                pfCookieResponse(true);
              }
              if (pfConsentStatus() != false && getCookie("OptanonConsent").includes(cookieCategory+":1")==false ) {
                    console.log('Consent Changed to Declined');
                     pfCookieResponse(false);   
                }
          });   
          clearInterval(checkExist);
        }
      cookiePreferences = getCookie("OptanonConsent");
      }, 500); // check every 100ms

});
</script>

  function parameterizeString(str) {
    return str
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-|-$)/g, "");
  }
  function pageObject() {
    const paths = document.location.pathname.split("/");

    let pageViewData = {};
    let experiences = [];
    let pathname = window.location.pathname;
    try {
      pageViewData = window.__PATHFACTORY__.pageViewData;
      experiences = pageViewData.experiences;
    } catch {}
    const filters = [
    {
        id: "businessUnits",
        label: "BU",
        plural: "Bu's",
        fieldName: "businessUnits",
        searchParamName: "businessUnits",

      getContentTypeText(contentTypeName) {
        let tags = {
          "White Paper": "Read the white paper ",
          "Live Webinar": "Save your seat",
          "Live Workshop": "Save your seat",
          "Industry Event": "Learn more",
          "MongoDB Event": "Learn more",

          Blog: "View the blog",
          Ebook: "View the ebook",
          Infographic: "View the infographic",
          "Research Report": " View the report",
        };

        return `
          <div>
            ${tags[contentTypeName.trim()] || `View the ${contentTypeName}`}
            <i class="arrow right"></i>
          </div>`;
      },
      getDescription(description) {
        let eventTime;
        let descArr = description.split("^");

        if (descArr.length > 1) {
          eventTime = descArr[0];
          description = descArr[1];
        } else {
          description = descArr[0];
        }

        return eventTime
          ? `<div>
            <span style="background-color:#1CED64">${eventTime}</span>
            <br>
            ${description}
            </div>`
          : `<div>${description}</div>`;
      },
      filterOptionLabel(filter, parameterizedName) {
        return (
          pageViewData[filter.id].find(
            (o) => o.parameterizedValue === parameterizedName
          ) || {}
        ).name;
      },
      filterOptions(filter) {
        // const items = experience.items;
        const items = contentItems;
        let optionsWithCounts = items
          .map((c) => c[filter.fieldName])
          .flat()
          .reduce((optionsAcc, option) => {
            optionsAcc[option] =
              option in optionsAcc ? optionsAcc[option] + 1 : 1;
            return optionsAcc;
          }, {});
        let filterLabel =
          filter.fieldName === "contentTypeName"
            ? "contentTypes"
            : filter.fieldName === "languageNames"
            ? "languages"
            : filter.fieldName;
        let solutionOptions;

        solutionOptions = pageViewData[filterLabel]
          .sort((a, b) =>
            a.name.toLowerCase() > b.name.toLowerCase()
              ? 1
              : b.name.toLowerCase() > a.name.toLowerCase()
              ? -1
              : 0
          )
          .map((a) => a.name);

        let options = solutionOptions
          .filter((solutionOption) => optionsWithCounts[solutionOption] > 0)
          .map((o) => ({ id: o, name: o, count: optionsWithCounts[o] }));

        const items2 = contentItems;
        let optionsWithCounts2 = items2
          .map((c) => c[filter.fieldName])
          .flat()
          .reduce((optionsAcc, option) => {
            optionsAcc[option] =
              option in optionsAcc ? optionsAcc[option] + 1 : 1;
            return optionsAcc;
          }, {});
        const options2 = solutionOptions
          .filter((solutionOption) => optionsWithCounts2[solutionOption] > 0)
          .map((o) => ({ id: o, name: o, count: optionsWithCounts2[o] }));
        const filteredArray = options2.map((i) => i.id);
        const consolidatedOptions = options.map((i) => {
          if (filteredArray.includes(i.id)) {
            return {
              ...i,
              common: true,
            };
          } else {
            return i;
          }
        });
        //console.log(consolidatedOptions, 'consolidatedOptions')

        let sortedConsolidatedOptions = consolidatedOptions
          .filter((i) => !!i.name)
          .sort((a, b) =>
            a.name.toLowerCase() > b.name.toLowerCase()
              ? 1
              : b.name.toLowerCase() > a.name.toLowerCase()
              ? -1
              : 0
          );

        let updatedOptionsWithCounts = this.filteredItemsContent
          .map((c) => c[filter.fieldName])
          .flat()
          .reduce((optionsAcc, option) => {
            optionsAcc[option] =
              option in optionsAcc ? optionsAcc[option] + 1 : 1;
            return optionsAcc;
          }, {});
        let countedOptions = sortedConsolidatedOptions.map((option) => {
          let type = option.name;
          let countOption = updatedOptionsWithCounts[type] || 0;
          return { ...option, count: countOption, common: countOption > 0 };
        });
        return countedOptions;
      },
      init() {
        this.filters.forEach((filter) => {
          this.selectedFilterOptions[filter.id] = [];
        });
        var that = this;
        var url = new URL(document.location);
        this.filters.forEach(function (filter) {
          if (url.searchParams.has(filter.searchParamName)) {
            var initialFilters =
              decodeURIComponent(
                url.searchParams.get(filter.searchParamName)
              ).split(",") || [];
            that.selectedFilterOptions[filter.id] = initialFilters.map((o) =>
              that.filterOptionLabel(filter, parameterizeString(o))
            );
            this.selectedFilterOptions = that.selectedFilterOptions;
          }
        });
        if (url.searchParams.has("section")) {
          setTimeout(() => {
            let elementToScroll = document.getElementById(
              url.searchParams.get("section")
            );
            //console.log(url.searchParams.get("section"), "url");
           // console.log(elementToScroll, "elementToScroll");
            if (elementToScroll) {
              const sectionTop = elementToScroll.offsetTop;
              window.scrollTo({
                top: sectionTop,
                behavior: "smooth",
              });
            }
          }, 2000);
        }
        if (url.searchParams.has("contentItem") && this.displayFrame) {
          this.displayFrame = false;
          let item = contentItems.filter(
            (contentItem) =>
              contentItem.id == url.searchParams.get("contentItem")
          )[0];
          if (item) {
            if (!this.videoContents.includes(item?.contentTypeName)) {
              setTimeout(() => {
                this.getHrefURL(item);
              }, 1000);
            } else {
              setTimeout(() => {
                let anchorInterval = setInterval(() => {
                  let anchorItem = document.getElementById(item?.id);
                  if (anchorItem) {
                    clearInterval(anchorInterval);
                    anchorItem.click();
                  } else {
                    let showMore = document.getElementById("show-more-btn");
                    if (showMore) {
                      showMore.click();
                    } else {
                      clearInterval(anchorInterval);
                    }
                  }
                }, 100);
              }, 2000);
            }
          }
        }
      },

      setParams() {
        var that = this;
        var url = new URL(document.location);
        this.filters.forEach(function (filter) {
          var selectedOptions = that?.selectedFilterOptions[filter.id];
          if (selectedOptions.length > 0) {
            url.searchParams.set(
              filter.searchParamName,
              selectedOptions.map((o) => parameterizeString(o)).join(",")
            );
          } else {
            url.searchParams.delete(filter.searchParamName);
          }
        });
        window.history.pushState({}, "", url);
      },
      setAnchorItem(item) {
        var url = new URL(document.location);
        url.searchParams.set("contentItem", item.id);
        window.history.pushState({}, "", url);
      },
      filtersChanged() {
        let hasFilter = this.hasFiltersSelected();
       if (hasFilter) {
          document.getElementsByClassName('pf-filters')[0].style.display = "block";
        } else {
          document.getElementsByClassName('pf-filters')[0].style.display = "none";
        }
        this.setParams();
        this.resetDefaultItems();
      },
      reset() {
        var that = this;
        this.search = "";
        this.filters.forEach(function (filter) {
          if (!filter.isGlobalFilter) {
            that.selectedFilterOptions[filter.id] = [];
          }
        });
        this.setParams();
      },
      isFilterOptionSelected(filter, option) {
        return (
          (this.selectedFilterOptions[filter.id] || []).indexOf(option) !== -1
        );
      },
      selectFilterOption(filter, option) {
       // console.log("test: select");
       // console.error(filter, option, "optionns");
        this.selectedFilterOptions[filter.id] =
          this.selectedFilterOptions[filter.id] || [];
        var optionIndex = this.selectedFilterOptions[filter.id].indexOf(option);
       // console.error(this.selectedFilterOptions, "this.selectedFilterOptions");
        if (optionIndex !== -1) {
          this.selectedFilterOptions[filter.id].splice(optionIndex, 1);
        } else {
          this.selectedFilterOptions[filter.id].push(option);
        }
        this.setParams();
        this.resetDefaultItems();

        }
        //console.error(this.selectedFilterOptions, "lassttttt this.selectedFilterOptions");
      },

        return this.filters;
      },
      resetDefaultItems() {
        this.defaultNoOfItems = 12;
        this.allContentsLoaded = false;
      },
      hasFiltersSelected() {
        //console.log("test: called");
        document.getElementsByClassName('pf-filters')[0].style.display = "block";
        let isSelected = false;
        let count = this.selectedFilterOptions;
       // console.log(this.selectedFilterOptions, "count");
        for (var i = 0; i < this.filters.length; i++) {
          var filter = this.filters[i];
          if (this.selectedFilterOptions[filter.id].length > 0) {
            isSelected = true;
            return isSelected;
          }
        }
        return isSelected;
      },

        this.defaultNoOfItems += 12;
        let filteredItemsShowed = this.filteredItems(true);
        if (filteredItemsShowed <= 0) {
          this.allContentsLoaded = true;
        }
      },

      },

        let filteredItems = contentItems;

          let selectedContentType = selectedFilterOptions.contentTypes[0];
          filteredItems = contentItems.filter(

        }

        if (selectedFilterOptions.personas.length > 0) {
          let itemFrequency = {};
          let selectedOptions = [];
          selectedFilterOptions.personas.map(
            (ele) =>
              (itemFrequency[ele] = itemFrequency[ele]

          Object.keys(itemFrequency).map((ele) =>
            selectedOptions.push(ele.toLowerCase())

          let filteredTopicItems = filteredItems.filter((item) => {

              let searchItem = item.personas[i].toLowerCase();
              if (selectedOptions.includes(searchItem)) {
                return true;
              }
            }
            return false;
          });
          filteredItems = filteredTopicItems;
        }


       

        // if (selectedFilterOptions.products.length > 0) {
        //   let itemFrequency = {};
        //   let selectedOptions = [];
        //   selectedFilterOptions.products.map(
        //     (ele) =>
        //       (itemFrequency[ele] = itemFrequency[ele]
        //         ? itemFrequency[ele] + 1

        //   Object.keys(itemFrequency).map((ele) =>
        //     selectedOptions.push(ele.toLowerCase())
        //   );
        //   let filteredTopicItems = filteredItems.filter((item) => {
        //     for (let i = 0; i < item.products.length; i++) {
        //       let searchItem = item.products[i].toLowerCase();
        //       if (selectedOptions.includes(searchItem)) {
        //         return true;
        //       }
        //     }
        //     return false;
        //   });
        //   filteredItems = filteredTopicItems;
        // }

        // if (selectedFilterOptions.solutions.length > 0) {
        //   let itemFrequency = {};
        //   let selectedOptions = [];
        //   selectedFilterOptions.solutions.map(
        //     (ele) =>
        //       (itemFrequency[ele] = itemFrequency[ele]
        //         ? itemFrequency[ele] + 1
        //         : 1)
        //   );
        //   Object.keys(itemFrequency).map((ele) =>
        //     selectedOptions.push(ele.toLowerCase())

        //   let filteredTopicItems = filteredItems.filter((item) => {

        //         return true;
        //       }
        //     }
        //     return false;
        //   });
        //   filteredItems = filteredTopicItems;
        // }

        this.filteredItemsContent = filteredItems;

        if (giveCount) {
          return filteredItems.length > this.defaultNoOfItems
            ? filteredItems.length - this.defaultNoOfItems
            : 0;
        }
        if (this.allContentsLoaded) {
          return filteredItems;
        } else {
          return filteredItems.slice(0, this.defaultNoOfItems);
